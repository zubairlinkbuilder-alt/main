<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#064d28"/>
      <stop offset="60%" style="stop-color:#0a6e3a"/>
      <stop offset="100%" style="stop-color:#1a5ca8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a017"/>
      <stop offset="100%" style="stop-color:#e8b92a"/>
    </linearGradient>
  </defs>
  <!-- Circle background -->
  <circle cx="200" cy="200" r="190" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="178" fill="none" stroke="url(#gold)" stroke-width="2.5" opacity="0.5"/>
  <!-- SA monogram -->
  <text x="200" y="195" text-anchor="middle" dominant-baseline="central" font-family="Georgia, 'Times New Roman', serif" font-weight="900" font-size="140" fill="#ffffff" letter-spacing="-4">SA</text>
  <!-- Divider line -->
  <line x1="110" y1="248" x2="290" y2="248" stroke="url(#gold)" stroke-width="2.5"/>
  <!-- GROUP text -->
  <text x="200" y="280" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="36" fill="url(#gold)" letter-spacing="14">GROUP</text>
  <!-- Tagline -->
  <text x="200" y="315" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="14" fill="rgba(255,255,255,0.55)" letter-spacing="4">SURAYYA ASLAM</text>
  <!-- Est year -->
  <text x="200" y="340" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="11" fill="rgba(255,255,255,0.35)" letter-spacing="3">EST. 1972</text>
</svg>
