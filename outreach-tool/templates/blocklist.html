{% extends "base.html" %}{% block content %}
<h1>Blocklist</h1>
<div class="card"><form method="post">
<label>Block domains (one per line). Subdomains are blocked too: blocking <code>example.com</code> also blocks <code>blog.example.com</code>.</label>
<textarea name="domains" placeholder="competitor.com&#10;spammy-site.net"></textarea>
<div class="actions"><button class="btn primary">Block</button></div></form></div>
<form method="post" action="/blocklist/delete">
<div class="actions"><button class="btn">Unblock selected</button> <span class="muted">{{ rows|length }} blocked domains</span></div>
<div class="tablewrap"><table><tr><th><input type="checkbox" data-checkall="ids"></th><th>Domain</th><th>Added</th></tr>
{% for r in rows %}<tr><td><input type="checkbox" name="ids" value="{{ r.id }}"></td><td>{{ r.domain }}</td><td>{{ r.added_at[:10] }}</td></tr>{% endfor %}
</table></div></form>
{% endblock %}
