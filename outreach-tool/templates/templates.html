{% extends "base.html" %}{% block content %}
<h1>Email templates</h1>
<div class="actions"><a class="btn primary" href="/templates/new">+ New template</a></div>
<div class="tablewrap"><table><tr><th>Name</th><th>Subject</th><th></th></tr>
{% for t in rows %}<tr><td><a href="/templates/{{ t.id }}">{{ t.name }}</a> {% if t.is_default %}<span class="tag found">default</span>{% endif %}</td><td>{{ t.subject }}</td>
<td><form method="post" action="/templates/{{ t.id }}/delete"><button class="btn danger" data-confirm="Delete this template?">Delete</button></form></td></tr>{% endfor %}
</table></div>
{% endblock %}
